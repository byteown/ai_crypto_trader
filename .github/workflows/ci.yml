name: CI/CD

defaults:
    run:
        working-directory: ./backend

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    build:
        runs-on: ubuntu-latest

        services:
          postgres:
            image: postgres:17

            ports:
              - 5432:5432

            env:
              POSTGRES_USER: agent
              POSTGRES_PASSWORD: password
              POSTGRES_DB: db_test

            options: >-
              --health-cmd "pg_isready -U agent"
              --health-interval 10s
              --health-timeout 3s
              --health-retries 5

        env:
          TEST_DATABASE_URL: "postgresql+asyncpg://agent:password@localhost:5432/db_test"
          DATABASE_URL: "postgresql+asyncpg://agent:password@localhost:5432/db_test"

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            - name: Install UV
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
              with:
                enable-cache: true

            - name: Install dependencies
              run:  uv sync --locked

            - name: Ruff check
              run:  uv run ruff check .

            - name: Ruff format check
              run:  uv run ruff format . --check

            - name: Run tests
              run:  uv run pytest tests

            - name: Alembic upgrade
              run:  uv run alembic upgrade head

            - name: Alembic check
              run:  uv run alembic check
